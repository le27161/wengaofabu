# 文稿发布系统 Docker 部署编排（国内镜像加速已内置于各 Dockerfile）
# 用法：docker compose up -d --build
#
# 说明：
#   - 使用你已有的 MySQL 数据库（不内置 MySQL 容器）：通过项目根目录 .env 配置
#     DB_HOST / DB_PORT / DB_USER / DB_PASSWORD / DB_NAME（见 docs/docker_deploy.md）。
#   - 所有 ${VAR:-默认值} 均可通过 .env 文件覆盖（docker compose 自动读取）。
#   - 生产环境务必修改 SECRET_KEY、数据库密码，并把 BASE_URL 改为实际域名/IP。
services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_AI_DEPS: "${INSTALL_AI_DEPS:-true}"
        TORCH_INDEX_URL: "${TORCH_INDEX_URL:-https://mirrors.aliyun.com/pytorch-wheels/cpu}"
    image: wgxt-backend:latest
    container_name: wgxt-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      # 已有 MySQL 连接信息（默认指向项目开发库，部署时用 .env 覆盖为你实际的库）
      DB_HOST: "${DB_HOST:-192.168.14.216}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_USER: "${DB_USER:-root}"
      DB_PASSWORD: "${DB_PASSWORD:-password!}"
      DB_NAME: "${DB_NAME:-wengaofabu}"
      # JWT 密钥：生产必须修改为随机长字符串
      SECRET_KEY: "${SECRET_KEY:-wengaofabu-prod-secret-change-me}"
      # 静态资源完整 URL 前缀：改为 http://你的域名 或 http://服务器IP
      BASE_URL: "${BASE_URL:-http://localhost:8000}"
      # 以下可选服务按需填写（Dify / Tavily / LLM / AI 阅读）
      DIFY_API_BASE: "${DIFY_API_BASE:-}"
      DIFY_API_KEY: "${DIFY_API_KEY:-}"
      DIFY_TIMEOUT: "${DIFY_TIMEOUT:-30}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      TAVILY_TIMEOUT: "${TAVILY_TIMEOUT:-15}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}"
      LLM_MODEL: "${LLM_MODEL:-qwen3.7-plus}"
      LLM_TIMEOUT: "${LLM_TIMEOUT:-90}"
      # AI 阅读功能（OpenAI 兼容接口）：AI 全文总结 / 划词分析 / 关键词提取
      AI_API_BASE: "${AI_API_BASE:-https://api.openai.com/v1}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-gpt-4o}"
      AI_TIMEOUT: "${AI_TIMEOUT:-60}"
      # 本地 Embedding：auto 优先 CUDA，不可用时回退 CPU
      EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-backend/app/multilingual-e5-small}"
      EMBEDDING_DEVICE: "${EMBEDDING_DEVICE:-auto}"
    volumes:
      # 上传文件持久化（后端 UPLOAD_DIR=uploads，相对 /app）
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    image: wgxt-frontend:latest
    container_name: wgxt-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
