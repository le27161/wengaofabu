# 前端 Nginx 配置：托管 SPA 静态资源，并把 /api、/static 反向代理到后端
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 允许上传较大的图片（后端单文件上限 20MB）
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端 API → 后端 FastAPI（保持 /api 前缀原样转发）
    location /api/ {
        # 运行期解析 Docker 内网 DNS：后端未就绪时 Nginx 也能正常启动，请求时再解析
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 任务 / Dify 工作流可能耗时较长（最长 3600s），放宽读取超时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 上传资源 → 后端静态目录（/static 原样转发）
    location /static/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vue Router history 模式：未命中文件时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
