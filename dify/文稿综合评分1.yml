        prompt_template:
        - id: 072ad974-a75c-4910-9ccf-767b6e136fdf
          role: system
          text: "# 任务：根据已经解析好的标题正文要素，完成标题‑内容适配度分项打分\n\n\n评分规则：\n1. 共4个维度，每个维度给出【0到该维度最大权重之间的整数分数】，不能超过权重上限，不能为负数。\n\
            维度1：主题核心一致性，权重上限40分；评判：标题核心主题是否是正文的核心，完全匹配40；部分匹配20；完全不匹配0。\n维度2：关键信息匹配度，权重上限30分；评判：标题的关键要素是否正文真实存在；识别标题党、捏造信息、夸大渲染；要素全部存在30；部分存在10‑20；完全捏造0。\n\
            维度3：叙事范围匹配度，权重上限20分；评判：标题划定的对象、场景，正文是否大量跑题写无关内容；范围完全匹配20；少量无关10；大量跑偏0。\n\
            维度4：立场情绪一致性，权重上限10分；评判标题情绪立场和正文是否冲突；完全一致10；轻微冲突5；严重冲突0。\n\n2. 每个维度必须写清楚简短的评分理由，客观陈述事实，不要主观臆断。\n\
            \n严格输出JSON，禁止多余文字。输出结构：\n{\n  \"dim1_score\": 整数,\n  \"dim1_reason\":\
            \ \"维度1理由\",\n  \"dim2_score\": 整数,\n  \"dim2_reason\": \"维度2理由\",\n \
            \ \"dim3_score\": 整数,\n  \"dim3_reason\": \"维度3理由\",\n  \"dim4_score\"\
            : 整数,\n  \"dim4_reason\": \"维度4理由\"\n}"
        - id: 980b893a-710a-4d68-b7b5-d1125d2ea698
          role: user
          text: 解析结果：{{#1786845414725.text#}}
        reasoning_format: separated
