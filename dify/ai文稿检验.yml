    - data:
        code: "import re\n\ndef main(text: str):\n    # 1. 清洗多余空白\n    cleaned = \"\
          \ \".join(text.split())\n    \n    # 2. 按中文句号、问号、感叹号分句（保留标点）\n    sentences\
          \ = re.findall(r'[^。！？!?]+[。！？!?]?', cleaned)\n    # 过滤空句\n    sentences\
          \ = [s.strip() for s in sentences if s.strip()]\n    \n    # 3. 简单提取疑似专有名词（两个汉字以上连续大写/引号词，或带职务头衔的词）\n\
          \    # 这里仅做占位提取，实际可调用分词库，但为了纯净度，我们只抓取带书名号、引号和人名特征词\n    entities = re.findall(r'《([^》]+)》|“([^”]+)”|([^\\\
          s，,。；;]{2,4}(?:部长|省长|主席|书记|将军|校长|院长))', cleaned)\n    # 扁平化处理\n    flat_entities\
          \ = [item for sub in entities for item in sub if item]\n\n    return {\n\
          \        \"cleaned_text\": cleaned,\n        \"sentence_count\": len(sentences),\n\
          \        \"sentence_list\": \"\\n\".join([f\"{i+1}. {s}\" for i, s in enumerate(sentences)]),\n\
          \        \"extracted_entities\": \"、\".join(list(set(flat_entities))[:5])\
          \  # 最多5个去重\n    }\n"
