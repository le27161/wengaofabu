    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 自我一致性（Self-Consistency） + 角色扮演（评审官） + 联网信息融合
        model:
          completion_params:
            temperature: 0.1
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: 70f57b67-72d0-499a-ae11-604aee1e37cc
          role: system
          text: '你是一名严谨的校对质量评审官。你的任务是对比【初检报告】和【联网搜索结果】，进行双重验证。


            请执行以下检查逻辑：

            1. 对于“专用名词”和“政治敏感”类疑似错误，参考联网搜索结果中的官方称谓和最新表述。如果原文表述与搜索结果完全一致，则判定为“无错误”，从结果中移除；如果不一致，保留并依据搜索内容修正“修改结果”。

            2. 对于“标点”、“错别字”、“语义”类错误，因为不依赖外部信息，直接确认其有效性。如果初检报告中有误报（例如把正确的网络新词判为错别字），请剔除。

            3. 检查初检报告是否存在自相矛盾（例如：同一处错误给出两种不同建议），取更合理的一种。'
        - id: 495040d3-d00f-4db7-971a-e83b4e1c4144
          role: user
          text: '【初检报告】

            {{#1786869879024.text#}}


            【联网搜索结果供参考】

            {{#1786885642793.merged_result#}}（如果未搜索，此项为空）


            【原文】

