    - data:
        code: "import json\n\ndef main(inputs) -> dict:\n    \"\"\"\n    兼容两种输入方式：\n\
          \    1. inputs 是字典（标准 Dify 输入变量）\n    2. inputs 是字符串（直接传入 JSON 文本）\n   \
          \ \"\"\"\n    # === 第1层：处理 inputs 本身 ===\n    # 如果 inputs 直接就是一个字符串，尝试解析为\
          \ JSON\n    if isinstance(inputs, str):\n        try:\n            data\
          \ = json.loads(inputs)\n        except json.JSONDecodeError:\n         \
          \   # 如果解析失败，返回空结果\n            return {\"errors\": [], \"need_search\"\
          : []}\n    # 如果 inputs 是字典（标准情况）\n    elif isinstance(inputs, dict):\n \
          \       # 检查是否有 \"json_data\" 这个键\n        if \"json_data\" in inputs:\n\
          \            raw = inputs[\"json_data\"]\n            # 如果值还是字符串，再解析一次\n\
          \            if isinstance(raw, str):\n                try:\n          \
          \          data = json.loads(raw)\n                except json.JSONDecodeError:\n\
          \                    data = {}\n            else:\n                data\
          \ = raw\n        else:\n            # 如果没有 \"json_data\" 键，说明数据直接放在根层级（如\
          \ {\"error\":[...]}）\n            data = inputs\n    else:\n        data\
          \ = {}\n\n    # === 第2层：确保 data 是字典 ===\n    if not isinstance(data, dict):\n\
          \        data = {}\n\n    # === 第3层：提取字段 ===\n    # 注意：原 JSON 字段是 \"error\"\
          （单数），不是 \"errors\"\n    errors = data.get(\"error\", [])\n    need_search\
          \ = data.get(\"need_search\", [])\n\n    # 确保输出是列表\n    if not isinstance(errors,\
          \ list):\n        errors = []\n    if not isinstance(need_search, list):\n\
          \        need_search = []\n\n    # 返回两个输出变量\n    return {\n        \"errors\"\
          : errors,          # 对应 Dify 输出变量 1\n        \"need_search\": need_search\
          \ # 对应 Dify 输出变量 2\n    }"
