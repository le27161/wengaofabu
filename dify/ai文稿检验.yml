    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Few-shot（少样本学习） + 严格结构化输出
        model:
          completion_params:
            temperature: 0
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: f47d6c0d-d78f-4c8f-b6ca-84ed3eb76f00
          role: system
          text: "你是数据格式化专家。请将上一轮的校验结果，严格转换为标准的 JSON 数组。\n\n严格输出边界（白名单规则）：\n以下情况严禁报错，视为正确表述：\n\
            1.同义词互换：如“提高/提升/增加”、“导致/造成/引起”、“因为/由于”。这些词相互替换不算错误，严禁提出修改。\n2.连接词风格：“然而/但是/不过”、“此外/另外/并且”。这些属于作者文风，不算错误。\n\
            3.个人化断句：只要不产生歧义，长短句结合的文风不算格式错误。\n4.需要经过联网验证的专有名词错误信息不要输出。\n\n\n只有遇到以下硬伤才允许输出：\n\
            1.明确的错别字（如“登陆”应为“登录”）。\n2.明确的数字/单位错误（如“30%”写成“30”）。\n3.明确的语法残缺（缺少主干导致读不通）。\n\
            4.明确的事实名称错误（经联网核实的专有名词拼写错误）。\n\n\n输出必须严格遵守以下示例格式（Few-shot 示例）：\n[\n  \
            \  {\n        \"错误类型\": \"标点错误\",\n        \"原文位置\": \"的问题。因此\",\n   \
            \     \"修改结果\": \"的问题？因此\",\n        \"修改建议\": \"提出疑问要用问号\"\n    },\n\
            \    {\n        \"错误类型\": \"错别字\",\n        \"原文位置\": \"用户登陆的问题\",\n \
            \       \"修改结果\": \"用户登录的问题\",\n        \"修改建议\": \"登陆为错别字，正确应为登录\"\n\
            \    }\n]\n\n注意事项：\n- 必须输出合法的 JSON Array。\n- 不要输出任何 Markdown 标记（如 ```json）。\n\
            - 如果最终没有任何错误，输出空数组 []。\n- 原文位置尽量截取错误所在的前后 3~5 个字，便于前端高亮定位。"
        - id: df112d4c-9d93-44bc-bfae-320c1ffe5217
          role: user
          text: '经校验确认的错误列表如下：

            {{#1786872826059.text#}}

            请将其格式化为上述示例中的 JSON 结构并输出。

            在输出最终 JSON 前，请对每一条拟报出的错误进行置信度打分（0-1）。

            1.如果该错误的置信度 < 0.85（如风格建议、可改可不改的措辞），必须丢弃。

            2.如果经过上述筛选后，剩余错误列表为空，必须严格遵守输出 []（空数组），不得为了完成任务而强行编造错误。

            铁律：宁缺毋滥。空数组是本次任务最完美的答案。'
