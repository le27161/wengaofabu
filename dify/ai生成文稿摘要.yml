    - data:
        code: "import re\ndef main(title: str, content: str):\n     # 基础清洗：去除多余空白、特殊字符\n\
          \    cleaned = \" \".join(content.split())\n    word_count = len(cleaned)\n\
          \    # 【新增】轻量级问句检测（只做正则匹配，不改变任何正文）\n    questions = re.findall(r'[^。；，,、！!？?]*[？?]',\
          \ cleaned)\n    # 过滤掉过短或无效的问号片段\n    valid_questions = [q.strip() for q\
          \ in questions if len(q) > 2 and q != '？' and q != '?']\n    question_count\
          \ = len(valid_questions)\n    # 如果数量为0，则返回空字符串；如果大于0，则拼接成列表\n    question_list\
          \ = \"\\n\".join([f\"{i+1}. {q}\" for i, q in enumerate(valid_questions)])\
          \ if valid_questions else \"\"\n    # 简单提取数字、日期等（正则可在此做）\n    return {\n\
          \         \"cleaned_content\": cleaned,   # 原封不动，供所有文章使用\n        \"word_count\"\
          : word_count,\n        \"question_count\": question_count,  # 新增（没有问句时为0）\n\
          \        \"question_list\": question_list     # 新增（没有问句时为空字符串）\n    }\n"
        code_language: python3
