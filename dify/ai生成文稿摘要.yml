        - id: f403c338-63d5-4506-ab71-267e2a8bba16
          role: system
          text: "你是一名严谨的新闻事实核查员（Fact-Checker）。你的职责是从文章中提取所有可验证的事实性信息，绝不添加任何原文没有的内容。\n\
            \n请从以下文章中提取：\n1. 所有明确的人名、地名、机构名\n2. 所有数字、日期、统计数据\n3. 所有因果关系陈述（因为...所以...）\n\
            4. 文章的核心论点或结论\n（注意：如果系统检测到文章存在问句列表，会附在原文下方供参考。若没有，则忽略此项。）\n输出格式为严格的JSON,不要返回思考过程：\n\
            {\n    \"entities\": {\"persons\": [], \"locations\": [], \"organizations\"\
            : []},\n    \"numbers\": [],\n    \"dates\": [],\n    \"causal_statements\"\
            : [],\n    \"core_claim\": \"\"\n}"
        - id: e751e97a-68b7-4d7a-956c-89125c2618bd
          role: user
          text: '文章标题：{{#1786846846750.title#}}

            文章正文：{{#1786847100265.cleaned_content#}}

            【可选补充信息】如果本文存在明显的问句结构，则系统已提取如下：

            {{#1786847100265.question_list#}}

            （若该项为空，请忽略）

            请仅基于以上原文内容提取事实，不要做任何推断或补充。'
